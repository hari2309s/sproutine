name: Send nudges

# The nudge scheduler (/api/cron/nudges) is built to run hourly. GitHub
# Actions calls it so it works on any Vercel plan (Hobby crons are daily only).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

jobs:
  nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the nudge scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/nudges"
