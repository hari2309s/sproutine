name: Langfuse eval gate

# This repo pushes directly to main (no PR flow), so the gate runs on every
# push and fails the job (red X) on regression rather than blocking a merge
# that's already happened. See packages/ai/evals/gate.ts for the thresholds.
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: langfuse/experiment-action@b945f9bf921b24a4074306078f621cba729d173e # v1.0.10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Deliberately no Supabase secrets here: routedGenerateText()'s
          # getGlobalUsage()/incrementUsage()/logEval() calls are all
          # try/catch-wrapped specifically to degrade gracefully without DB
          # access. Giving this job the production service-role key would
          # needlessly expose it, and — worse — would make CI eval runs
          # increment the real daily_llm_usage provider quota counters and
          # write rows into the real eval_logs table alongside production
          # traffic.
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          experiment_path: packages/ai/evals/gate.ts
          dataset_name: agent-golden
          should_comment_on_pr: false
          github_token: ${{ github.token }}
          # gate.ts's transitive imports (router.ts -> ai, @ai-sdk/*,
          # @supabase/supabase-js, etc.) need the real pnpm install above —
          # the action's own install only fetches the 5 Langfuse/OTel/tsx
          # packages into an isolated temp dir with none of those. Our own
          # packages/ai/package.json already carries @langfuse/client,
          # @langfuse/tracing, @langfuse/otel, @opentelemetry/sdk-node, and
          # tsx, so skip the action's redundant (and insufficient) install.
          should_skip_sdk_installation: true
